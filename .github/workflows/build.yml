name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Test (unit, end-to-end relay, headless RustRover)
        run: ./gradlew test -PplatformTests=true
      - name: Plugin Verifier (RustRover, CLion)
        run: ./gradlew verifyPlugin
      - name: Build plugin
        run: ./gradlew buildPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: build/distributions/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            build/reports/tests
            build/reports/pluginVerifier
            build/screenshots

  release:
    # Runs for version tags (v0.1.0) once the signing and Marketplace secrets are set in the repository.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    env:
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Sign and publish
        if: env.PUBLISH_TOKEN != '' && env.CERTIFICATE_CHAIN != ''
        run: ./gradlew publishPlugin -PpluginVersion="${GITHUB_REF_NAME#v}"
      - name: Secrets missing
        if: env.PUBLISH_TOKEN == '' || env.CERTIFICATE_CHAIN == ''
        run: echo "::warning::Set CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD and PUBLISH_TOKEN to publish."
