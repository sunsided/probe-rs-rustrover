---
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; no job needs more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  build:
    name: Test, verify and build
    runs-on: ubuntu-latest
    steps:
      # RustRover, CLion (for the Verifier) and the test sandboxes don't fit next to the runner's preinstalled SDKs.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          # Only main writes the cache, so a pull request can't plant something the next main build picks up.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Test (unit, end-to-end relay, headless RustRover)
        run: ./gradlew test -PplatformTests=true
      - name: Plugin Verifier (RustRover, CLion)
        run: ./gradlew verifyPlugin
      - name: Build plugin
        run: ./gradlew buildPlugin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: build/distributions/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports
          path: |
            build/reports/tests
            build/reports/pluginVerifier
            build/screenshots
