name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # RustRover, CLion (for the Verifier) and the test sandboxes don't fit next to the runner's preinstalled SDKs.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Test (unit, end-to-end relay, headless RustRover)
        run: ./gradlew test -PplatformTests=true
      - name: Plugin Verifier (RustRover, CLion)
        run: ./gradlew verifyPlugin
      - name: Build plugin
        run: ./gradlew buildPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: build/distributions/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            build/reports/tests
            build/reports/pluginVerifier
            build/screenshots

  release:
    # For version tags (v0.1.0): a GitHub Release with the zip, the plugin repository on GitHub Pages pointing to it,
    # and the Marketplace once its signing and publishing secrets are set.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build plugin
        run: ./gradlew buildPlugin -PpluginVersion="${GITHUB_REF_NAME#v}"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/distributions/*.zip --title "$GITHUB_REF_NAME" --generate-notes
      - name: Plugin repository (updatePlugins.xml)
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip="$(basename build/distributions/*.zip)"
          mkdir -p site
          cat > site/updatePlugins.xml <<XML
          <?xml version="1.0" encoding="UTF-8"?>
          <plugins>
            <plugin id="dev.markusmayer.proberover" version="$version"
                    url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$zip">
              <name>probe-rs Debugging</name>
              <idea-version since-build="263"/>
            </plugin>
          </plugins>
          XML
          cat site/updatePlugins.xml
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
      - name: Sign and publish to the Marketplace
        if: env.PUBLISH_TOKEN != '' && env.CERTIFICATE_CHAIN != ''
        run: ./gradlew publishPlugin -PpluginVersion="${GITHUB_REF_NAME#v}"
